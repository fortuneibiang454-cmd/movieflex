<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FortuneFlix - Watch Movies & Trailers</title>
<style>
:root { --bg:#141414; --card:#222; --text:white; --red:#e50914; }
body.light { --bg:#f5f5f5; --card:#fff; --text:#000; }
body { background:var(--bg); color:var(--text); font-family:Arial, sans-serif; margin:0; padding:0; }
header { display:flex; justify-content:space-between; align-items:center; padding:15px 30px; background:var(--card); position:sticky; top:0; }
.logo { font-size:28px; color:var(--red); font-weight:bold; }
button { padding:10px 18px; background:var(--red); color:white; border:none; border-radius:5px; cursor:pointer; font-size:15px; margin:5px; }
#loginPage { max-width:400px; margin:100px auto; padding:30px; background:var(--card); border-radius:10px; text-align:center; }
input { width:90%; padding:12px; margin:10px 0; border-radius:5px; border:1px solid #555; background:var(--bg); color:var(--text); }
#app { display:none; padding:20px; }
.search-bar { text-align:center; margin:20px 0; }
.search-bar input { width:60%; max-width:400px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:20px; padding:0 10px; }
.card { background:var(--card); padding:10px; border-radius:8px; cursor:pointer; }
.card:hover { transform:scale(1.05); }
.card img { width:100%; height:270px; object-fit:cover; border-radius:5px; }
#details { margin:30px 10px; padding:20px; background:var(--card); border-radius:10px; display:none; }
.details-container { display:flex; gap:20px; flex-wrap:wrap; }
iframe { width:100%; height:400px; border:none; margin-top:15px; }
</style>
</head>
<body>

<div id="loginPage">
  <div class="logo">🎬 FORTUNEFLIX</div>
  <h2>Login or Sign Up</h2>
  <input type="email" id="email" placeholder="Enter email">
  <input type="password" id="password" placeholder="Enter password">
  <button onclick="login()">Login</button>
  <button onclick="signup()">Sign Up</button>
  <p id="error" style="color:red;"></p>
</div>

<div id="app">
  <header>
    <div class="logo">🎬 FORTUNEFLIX</div>
    <div><button onclick="logout()">Logout</button></div>
  </header>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search movies...">
    <button onclick="searchMovies()">Search</button>
  </div>
  <div id="results"></div>
  <div id="details"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyALp9SbNRfarY1u80zoGIbGgOt-k-2KGLw",
  authDomain: "fortuneflex.firebaseapp.com",
  projectId: "fortuneflex",
  appId: "1:869550247929:web:c7e7c25e322ab6d519b728"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const OMDB_API_KEY = "83909843";
const YOUTUBE_API_KEY = "AIzaSyDs4dG_hfTD6yDCHRmwu-VfYWgCfj_Mwkw";

onAuthStateChanged(auth, user => {
  if(user) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadHomepage(); 
  } else {
    document.getElementById('loginPage').style.display = 'block';
    document.getElementById('app').style.display = 'none';
  }
});

window.login = () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  signInWithEmailAndPassword(auth, email, password)
 .catch(error => document.getElementById('error').innerText = error.message);
}

window.signup = () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  createUserWithEmailAndPassword(auth, email, password)
 .catch(error => document.getElementById('error').innerText = error.message);
}

window.logout = () => signOut(auth);

async function fetchMovies(query, containerId) {
  const res = await fetch(`https://www.omdbapi.com/?s=${query}&apikey=${OMDB_API_KEY}`);
  const data = await res.json();
  displayRow(data.Search, containerId);
}

async function loadHomepage() {
  document.getElementById('results').innerHTML = `
    <h2>🔥 Trending Now</h2><div class="grid" id="row1"></div>
    <h2>⚡ Action</h2><div class="grid" id="row2"></div>
  `;
  fetchMovies('marvel', 'row1');
  fetchMovies('action', 'row2');
}

async function searchMovies() {
  const query = document.getElementById('searchInput').value;
  if(!query) return loadHomepage();
  document.getElementById('results').innerHTML = `<h2>Results for "${query}"</h2><div class="grid" id="searchResults"></div>`;
  const res = await fetch(`https://www.omdbapi.com/?s=${query}&apikey=${OMDB_API_KEY}`);
  const data = await res.json();
  displayRow(data.Search, 'searchResults');
}
window.searchMovies = searchMovies;

async function showMovieDetails(imdbID) {
  const res = await fetch(`https://www.omdbapi.com/?i=${imdbID}&apikey=${OMDB_API_KEY}`);
  const movie = await res.json();
  const trailerId = await getTrailer(movie.Title);
  document.getElementById('details').style.display = 'block';
  document.getElementById('details').innerHTML = `
    <h2>${movie.Title}</h2>
    <p>${movie.Plot}</p>
    ${trailerId? `<iframe src="https://www.youtube.com/embed/${trailerId}?autoplay=1"></iframe>` : ''}
  `;
}
window.showMovieDetails = showMovieDetails;

async function getTrailer(title) {
  try {
    const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(title)}+trailer&key=${YOUTUBE_API_KEY}&maxResults=1`);
    const data = await res.json();
    return data.items[0]?.id?.videoId;
  } catch { return null; }
}

function displayRow(movies, containerId) {
  const resultsDiv = document.getElementById(containerId);
  if(!resultsDiv || !movies) return;
  resultsDiv.innerHTML = '';
  movies.slice(0,6).forEach(movie => {
    const poster = movie.Poster!== 'N/A'? movie.Poster : 'https://via.placeholder.com/180x270';
    resultsDiv.innerHTML += `<div class="card" onclick="showMovieDetails('${movie.imdbID}')"><img src="${poster}"><h4>${movie.Title}</h4></div>`;
  });
}
</script>
</body>
 </html>
