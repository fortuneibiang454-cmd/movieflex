<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MovieFlix Pro Max</title>
  <style>
    :root { --bg:#141414; --card:#222; --text:white; }
    body.light { --bg:#f5f5f5; --card:#fff; --text:#000; }
    body { background:var(--bg); color:var(--text); font-family:Arial; margin:0; padding:20px; transition:0.3s; }
    h1 { text-align:center; color:#e50914; }
    .top-bar { display:flex; justify-content:space-between; align-items:center; }
    .nav { display:flex; justify-content:center; gap:10px; margin:20px 0; flex-wrap:wrap; }
    .nav button { padding:10px 15px; background:#333; color:var(--text); border:none; border-radius:5px; cursor:pointer; }
    .nav button.active { background:#e50914; color:white; }
    .search-box { text-align:center; margin:20px; }
    input { padding:12px; width:300px; border-radius:5px; border:1px solid #555; background:var(--card); color:var(--text); }
    button { padding:12px 20px; background:#e50914; color:white; border:none; border-radius:5px; cursor:pointer; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:20px; margin-top:30px; }
    .card { background:var(--card); padding:10px; border-radius:8px; cursor:pointer; position:relative; }
    .card img { width:100%; border-radius:5px; }
    .fav-btn { position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.7); border:none; font-size:20px; }
    #details { margin-top:30px; padding:20px; background:var(--card); border-radius:10px; display:none; }
    #details img { width:200px; float:left; margin-right:20px; border-radius:10px; }
    iframe { width:100%; max-width:800px; height:400px; border:none; border-radius:10px; margin-top:20px; }
    .logo { font-size:28px; font-weight:bold; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="logo">🎬 FORTUNEFLIX</div> <!-- 3. YOUR LOGO HERE -->
    <button onclick="toggleTheme()">🌙 Dark/Light</button>
  </div>
  
  <div class="nav">
    <button onclick="loadCategory('avengers')" class="active">Trending</button>
    <button onclick="loadCategory('action')">Action</button>
    <button onclick="loadCategory('comedy')">Comedy</button>
    <button onclick="loadCategory('horror')">Horror</button> <!-- 1. NEW CATEGORY -->
    <button onclick="showList('favorites')">Favorites ❤️</button>
    <button onclick="showList('watchlater')">Watch Later ⏰</button> <!-- 2. WATCH LATER -->
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search movies...">
    <button onclick="searchMovies()">Search</button>
  </div>

  <div class="grid" id="results"></div>
  <div id="details"></div>
  <div id="trailer"></div>

<script>
const OMDB_API_KEY = "83909843";
let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
let watchlater = JSON.parse(localStorage.getItem('watchlater')) || [];

// 1. DARK/LIGHT MODE
function toggleTheme() {
  document.body.classList.toggle('light');
  localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
}
if(localStorage.getItem('theme') === 'light') document.body.classList.add('light');

function loadCategory(query) {
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('searchInput').value = query;
  searchMovies();
}

async function searchMovies() {
  const query = document.getElementById('searchInput').value;
  const res = await fetch(`https://www.omdbapi.com/?s=${query}&apikey=${OMDB_API_KEY}`);
  const data = await res.json();
  displayResults(data.Search);
}

async function showMovieDetails(imdbID) {
  const res = await fetch(`https://www.omdbapi.com/?i=${imdbID}&apikey=${OMDB_API_KEY}`);
  const movie = await res.json();
  const shareLink = `https://www.omdbapi.com/?i=${imdbID}&apikey=${OMDB_API_KEY}`;
  
  document.getElementById('details').style.display = 'block';
  document.getElementById('details').innerHTML = `
    <img src="${movie.Poster}">
    <h2>${movie.Title} (${movie.Year})</h2>
    <p><b>Rating:</b> ${movie.imdbRating}/10</p>
    <p><b>Actors:</b> ${movie.Actors}</p>
    <p><b>Plot:</b> ${movie.Plot}</p>
    <button onclick="toggleList('favorites','${movie.imdbID}','${movie.Title}','${movie.Poster}')">
      ${favorites.find(f => f.id === movie.imdbID) ? 'Remove ❤️' : 'Add ❤️ Favorites'}
    </button>
    <button onclick="toggleList('watchlater','${movie.imdbID}','${movie.Title}','${movie.Poster}')">
      ${watchlater.find(f => f.id === movie.imdbID) ? 'Remove ⏰' : 'Add ⏰ Watch Later'}
    </button>
    <button onclick="shareMovie('${movie.Title}','${imdbID}')">4. Share 📤</button> <!-- 4. SHARE BUTTON -->
    <button onclick="playTrailer('${movie.Title}')">Watch Trailer</button>
  `;
}

function displayResults(movies) {
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '';
  document.getElementById('details').style.display = 'none';
  document.getElementById('trailer').innerHTML = '';
  
  if(movies){
    movies.forEach(movie => {
      resultsDiv.innerHTML += `
        <div class="card">
          <button class="fav-btn" onclick="toggleList('favorites','${movie.imdbID}','${movie.Title}','${movie.Poster}')">❤️</button>
          <img src="${movie.Poster !== 'N/A' ? movie.Poster : 'https://via.placeholder.com/200x300'}" onclick="showMovieDetails('${movie.imdbID}')">
          <h3 onclick="showMovieDetails('${movie.imdbID}')">${movie.Title}</h3>
          <p>${movie.Year}</p>
        </div>
      `;
    });
  }
}

function playTrailer(title) {
  document.getElementById('trailer').innerHTML = `
    <h2>Trailer: ${title}</h2>
    <iframe src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(title + ' Official Trailer')}" allowfullscreen></iframe>
  `;
}

// 2. FAVORITES + WATCH LATER
function toggleList(type, id, title, poster) {
  let list = type === 'favorites' ? favorites : watchlater;
  const index = list.findIndex(f => f.id === id);
  if(index > -1) list.splice(index, 1); else list.push({id, title, poster});
  localStorage.setItem(type, JSON.stringify(list));
}

function showList(type) {
  let list = type === 'favorites' ? favorites : watchlater;
  displayResults(list.map(f => ({imdbID: f.id, Title: f.title, Poster: f.poster, Year: ''})));
}

// 4. SHARE BUTTON
function shareMovie(title, id) {
  const link = `https://fortuneibiang454-cmd.github.io/movieflex/?movie=${id}`;
  navigator.clipboard.writeText(link);
  alert(`Link copied! 📤\nSend this to friends: ${title}`);
}

// Load trending + theme on start
loadCategory('avengers');
</script>
</body>
  </html>
