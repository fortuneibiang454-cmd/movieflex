<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FortuneFlix</title>
<style>
body { background:#141414; color:white; font-family:Arial; margin:0; }
.login-box { max-width:400px; margin:100px auto; padding:30px; background:#222; border-radius:10px; text-align:center; }
input { width:90%; padding:12px; margin:10px 0; border-radius:5px; border:1px solid #555; background:#141414; color:white; }
button { padding:12px; background:#e50914; color:white; border:none; border-radius:5px; cursor:pointer; width:95%; margin:5px; }
#app { display:none; padding:20px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:15px; margin-top:20px; }
.card { background:#222; padding:10px; border-radius:8px; cursor:pointer; text-align:center; }
.card img { width:100%; border-radius:5px; }
</style>
</head>
<body>

<div id="loginPage">
  <div class="login-box">
    <h1 style="color:#e50914;">🎬 FORTUNEFLIX</h1>
    <input type="email" id="email" placeholder="Enter email">
    <input type="password" id="password" placeholder="Enter password">
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<div id="app">
  <h1 style="color:#e50914;">🎬 FORTUNEFLIX</h1>
  <button onclick="logout()">Logout</button>
  <input type="text" id="searchInput" placeholder="Search movies..." style="width:250px; padding:10px;">
  <button onclick="searchMovies()">Search</button>
  <div class="grid" id="results"></div>
  <div id="details"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyALp9SbNRfarY1u80zoGIbGgOt-k-2KGLw",
  authDomain: "fortuneflex.firebaseapp.com",
  projectId: "fortuneflex"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const OMDB_API_KEY = "83909843";
const YOUTUBE_API_KEY = "YOUR_NEW_YOUTUBE_KEY_HERE";

onAuthStateChanged(auth, user => {
  if(user) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } else {
    document.getElementById('loginPage').style.display = 'block';
    document.getElementById('app').style.display = 'none';
  }
});

window.login = () => {
  signInWithEmailAndPassword(auth, email.value, password.value)
  .catch(error => error.innerText = error.message);
}
window.signup = () => {
  createUserWithEmailAndPassword(auth, email.value, password.value)
  .catch(error => error.innerText = error.message);
}
window.logout = () => signOut(auth);

async function searchMovies() {
  const query = document.getElementById('searchInput').value;
  const res = await fetch(`https://www.omdbapi.com/?s=${query}&apikey=${OMDB_API_KEY}`);
  const data = await res.json();
  displayResults(data.Search);
}
window.searchMovies = searchMovies;

function displayResults(movies) {
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '';
  if(movies){
    movies.forEach(movie => {
      resultsDiv.innerHTML += `
        <div class="card">
          <img src="${movie.Poster}">
          <h3>${movie.Title}</h3>
        </div>
      `;
    });
  }
}
</script>
</body>
</html>
