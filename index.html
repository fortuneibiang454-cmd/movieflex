<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FortuneFlix</title>
  <style>
    :root { --bg:#141414; --card:#222; --text:white; }
    body.light { --bg:#f5f5f5; --card:#fff; --text:#000; }
    body { background:var(--bg); color:var(--text); font-family:Arial; margin:0; transition:0.3s; }
   .login-box { max-width:400px; margin:100px auto; padding:30px; background:var(--card); border-radius:10px; text-align:center; }
    input { width:90%; padding:12px; margin:10px 0; border-radius:5px; border:1px solid #555; background:var(--bg); color:var(--text); }
    button { padding:12px 20px; background:#e50914; color:white; border:none; border-radius:5px; cursor:pointer; width:95%; margin:5px; }
    #app { display:none; padding:20px; }
   .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
   .nav { display:flex; justify-content:center; gap:10px; margin:20px 0; flex-wrap:wrap; }
   .nav button { padding:10px 15px; background:#333; color:var(--text); border:none; border-radius:5px; cursor:pointer; width:auto; }
   .nav button:hover { background:#e50914; }
   .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:20px; margin-top:30px; }
   .card { background:var(--card); padding:10px; border-radius:8px; cursor:pointer; }
   .card img { width:100%; border-radius:5px; }
    #details { margin-top:30px; padding:20px; background:var(--card); border-radius:10px; display:none; }
  </style>
</head>
<body>

<div id="loginPage">
  <div class="login-box">
    <h1 style="color:#e50914;">🎬 FORTUNEFLIX</h1>
    <input type="email" id="email" placeholder="Enter email">
    <input type="password" id="password" placeholder="Enter password">
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
    <p id="error" style="color:red; font-size:14px;"></p>
  </div>
</div>

<div id="app">
  <div class="top-bar">
    <div style="font-size:24px; color:#e50914; font-weight:bold;">🎬 FORTUNEFLIX</div>
    <div>
      <button onclick="toggleTheme()" style="width:auto;">🌙</button>
      <button onclick="logout()" style="width:auto;">Logout</button>
    </div>
  </div>

  <div class="nav">
    <button onclick="loadCategory('avengers')">Trending</button>
    <button onclick="loadCategory('action')">Action</button>
    <button onclick="loadCategory('comedy')">Comedy</button>
    <button onclick="loadCategory('horror')">Horror</button>
    <button onclick="loadCategory('romance')">Romance</button>
    <button onclick="loadCategory('anime')">Anime</button>
  </div>

  <div style="text-align:center; margin:20px 0;">
    <input type="text" id="searchInput" placeholder="Search movies..." style="width:300px; padding:10px;">
    <button onclick="searchMovies()" style="width:auto;">Search</button>
  </div>

  <div class="grid" id="results"></div>
  <div id="details"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyALp9SbNRfarY1u80zoGIbGgOt-k-2KGLw",
  authDomain: "fortuneflex.firebaseapp.com",
  projectId: "fortuneflex",
  storageBucket: "fortuneflex.firebasestorage.app",
  messagingSenderId: "869550247929",
  appId: "1:869550247929:web:c7e7c25e322ab6d519b728",
  measurementId: "G-MRRCT1HFPP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const OMDB_API_KEY = "83909843";
const YOUTUBE_API_KEY = "AIzaSyB5IyYCOW8FqAVDNCHEr5AAmYmDC4AOFxY";

onAuthStateChanged(auth, user => {
  if(user) {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadCategory('avengers');
  } else {
    document.getElementById('loginPage').style.display = 'block';
    document.getElementById('app').style.display = 'none';
  }
});

window.login = () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  signInWithEmailAndPassword(auth, email, password)
  .catch(error => document.getElementById('error').innerText = error.message);
}

window.signup = () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  createUserWithEmailAndPassword(auth, email, password)
  .catch(error => document.getElementById('error').innerText = error.message);
}

window.logout = () => signOut(auth);
window.toggleTheme = () => document.body.classList.toggle('light');

async function searchMovies() {
  const query = document.getElementById('searchInput').value;
  if(!query) return;
  const res = await fetch(`https://www.omdbapi.com/?s=${query}&apikey=${OMDB_API_KEY}`);
  const data = await res.json();
  displayResults(data.Search);
}
window.searchMovies = searchMovies;
window.loadCategory = (query) => { document.getElementById('searchInput').value = query; searchMovies(); }

window.showMovieDetails = async (imdbID) => {
  const res = await fetch(`https://www.omdbapi.com/?i=${imdbID}&apikey=${OMDB_API_KEY}`);
  const movie = await res.json();
  const trailerId = await getTrailer(movie.Title);

  document.getElementById('details').style.display = 'block';
  document.getElementById('details').innerHTML = `
    <div style="display:flex; gap:20px; flex-wrap:wrap;">
      <img src="${movie.Poster!== 'N/A'? movie.Poster : 'https://via.placeholder.com/200x300'}" style="width:200px; border-radius:8px;">
      <div style="flex:1; min-width:250px;">
        <h2>${movie.Title} (${movie.Year})</h2>
        <p><b>Rating:</b> ⭐ ${movie.imdbRating}/10</p>
        <p><b>Genre:</b> ${movie.Genre}</p>
        <p><b>Plot:</b> ${movie.Plot}</p>
        ${trailerId? `<button onclick="playTrailer('${trailerId}')" style="background:#FF0000;">▶️ Watch Trailer</button>` : ''}
        <button onclick="searchStreaming('${movie.Title}')">📺 Watch Now</button>
      </div>
    </div>
    <div id="trailerPlayer" style="margin-top:20px; display:none;">
      <iframe id="trailerFrame" width="100%" height="400" src="" frameborder="0" allowfullscreen></iframe>
    </div>
  `;
}

async function getTrailer(title) {
  try {
    const res = await fetch(`https://www.youtube.com/results?search_query=${encodeURIComponent(title)}+official+trailer`);
    const text = await res.text();
    const videoId = text.split('watch?v=')[1]?.split('"')[0];
    return videoId;
  } catch { return null; }
}

window.playTrailer = (videoId) => {
  const player = document.getElementById('trailerPlayer');
  const frame = document.getElementById('trailerFrame');
  frame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
  player.style.display = 'block';
  player.scrollIntoView({behavior: 'smooth'});
}

window.searchStreaming = (title) => {
  window.open(`https://www.google.com/search?q=watch+${encodeURIComponent(title)}+online`, '_blank');
}

function displayResults(movies) {
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '';
  document.getElementById('details').style.display = 'none';
  if(movies){
    movies.forEach(movie => {
      const poster = movie.Poster!== 'N/A'? movie.Poster : 'https://via.placeholder.com/200x300/222/fff?text=No+Image';
      resultsDiv.innerHTML += `
        <div class="card" onclick="showMovieDetails('${movie.imdbID}')">
          <img src="${poster}" onerror="this.src='https://via.placeholder.com/200x300/222/fff?text=No+Image'">
          <h3>${movie.Title}</h3>
        </div>
      `;
    });
  }
}
</script>
</body>
</html>
