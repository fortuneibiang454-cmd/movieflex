<!DOCTYPE html>
<html lang="en">
<head<head>
  <meta charset="UTF-8">
  <title>MovieFlix</title>
  <link rel="stylesheet" href="style.css">
  
  <script type="module">
    // 1. Import Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // 2. YOUR KEYS
    const firebaseConfig = {
      apiKey: "AIzaSyBPMIyM0HHN27aW8PvkIN0RNzFk1g-l2Co",
      authDomain: "movieflex-482dd.firebaseapp.com",
      databaseURL: "https://movieflex-482dd-default-rtdb.firebaseio.com",
      projectId: "movieflex-482dd",
      storageBucket: "movieflex-482dd.firebasestorage.app",
      messagingSenderId: "646299297093",
      appId: "1:646299297093:web:6fb9822774507d3f20ca2c"
    };

    // 3. Start Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 4. AUTH GATE: If no user, go to login
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      }
    });

    // 5. LOGOUT BUTTON FUNCTION
    window.logout = () => {
      signOut(auth).then(() => { window.location.href = "login.html"; });
    }
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieFlix</title>
  <style>
    *{margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}
    body{background:#141414; color:white; padding-top:80px;}

    nav{
      display:flex; justify-content:space-between; align-items:center; 
      padding:20px 50px; background:#000; 
      position:fixed; width:100%; top:0; left:0; z-index:10;
    }
    nav h1{color:#e50914; font-size:28px;}
    nav a{color:white; margin:0 15px; text-decoration:none;}
    nav a:hover{color:#e50914;}

    .hero{
      height:90vh; 
      background: linear-gradient(to right, rgba(0,0,0,0.8), transparent 60%), 
                  url('https://image.tmdb.org/t/p/original/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg') center/cover no-repeat;
      display:flex; align-items:center; padding:0 50px;
    }
    .hero h2{font-size:48px; margin-bottom:20px;}
    .watch-button{background: #e50914; color: white; padding:12px 24px; border:none; border-radius:5px; font-weight:bold; margin-right:10px; font-size:16px;}
    .info-button{background: rgba(109,109,110,0.7); color: white; padding:12px 24px; border:none; border-radius:5px; font-weight:bold; font-size:16px;}

    .movies{padding:50px;}
    .movies h3{font-size:24px; margin-bottom:20px;}
    .movie-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
  padding: 20px;
    }
    .movie-card:hover{transform:scale(1.05);}
    .movie-card img{
      width:100%; 
      height:300px; 
      object-fit:cover; 
      display:block; 
    }
    .movie-card {
  transition: transform 0.3s;
}
.movie-card:hover {
  transform: scale(1.05);
}
.movie-card a {
  display: block;
  background: #e50914;
  color: white;
  text-align: center;
  padding: 8px;
  text-decoration: none;
  border-radius: 4px;
    }
  </style>
</head>
<body>
  <nav>
    <h1>MovieFlix</h1>
    <a href="login.html">Login</a>
    <button onclick="logout()" style="background:#e50914; color:white; border:none; padding:8px 12px; border-radius:4px;">Logout</button>
    <div>
      <a href="#">Home</a>
      <a href="#">Movies</a>
      <a href="#">Series</a>
    </div>
  </nav>

  <section class="hero">
  <h2>Avatar</h2>
  <button class="watch-button" onclick="window.open('https://www.youtube.com/watch?v=d9MyW72ELq0', '_blank')">Watch Now</button>
  <button class="info-button" onclick="alert('Avatar: A marine on an alien planet')">More Info</button>
</section>

<section>
  <h3>All Movies</h3>
  <div class="movie-grid">
    <div class="movie-card">
      <img src="spiderman.jpg" alt="Spiderman">
      <h3>Spiderman</h3>
      <a href="watch.html">Watch Now</a>
    </div>
    <!-- copy this card for more movies -->
  </div>
</section>
  <section class="movies">
    <h3>Trending Now</h3>
    <div class="movie-grid">
      <div class="movie-card">
        <img src="https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg" alt="Avatar">
      </div>
      <div class="movie-card">
        <img src="https://image.tmdb.org/t/p/w500/r2J02Z2OpNTv8ysPPL4DbUDrumN.jpg" alt="Movie 2">
      </div>
      <div class="movie-card">
        <img src="https://image.tmdb.org/t/p/w500/6DrHO1jr3qVrViUO6s6kFiAGM7.jpg" alt="Movie 3">
      </div>
      <div class="movie-card">
        <img src="https://image.tmdb.org/t/p/w500/pIkRyD18kl4Fhrujh52PPpRwLg.jpg" alt="Movie 4">
      </div>
    </div>
  </section>
</body>
</html>
