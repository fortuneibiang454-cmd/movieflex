<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MovieFlix</title>
  <style>
    body { background:#141414; color:white; font-family:Arial; padding:20px; }
    h1 { text-align:center; color:#e50914; }
    .search-box { text-align:center; margin:20px; }
    input { padding:12px; width:300px; border-radius:5px; border:none; }
    button { padding:12px 20px; background:#e50914; color:white; border:none; border-radius:5px; cursor:pointer; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:20px; margin-top:30px; }
    .card { background:#222; padding:10px; border-radius:8px; cursor:pointer; transition:0.3s; }
    .card:hover { transform:scale(1.05); }
    .card img { width:100%; border-radius:5px; }
    #trailer { margin-top:30px; text-align:center; }
    iframe { width:90%; max-width:800px; height:450px; border:none; border-radius:10px; }
  </style>
</head>
<body>
  <h1>🎬 MovieFlix</h1>
  
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search movies...">
    <button onclick="searchMovies()">Search</button>
  </div>

  <div class="grid" id="results"></div>
  <div id="trailer"></div>

<script>
const OMDB_API_KEY = "83909843"; // your OMDB key

async function searchMovies() {
  const query = document.getElementById('searchInput').value;
  const res = await fetch(`https://www.omdbapi.com/?s=${query}&apikey=${OMDB_API_KEY}`);
  const data = await res.json();
  
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '';
  document.getElementById('trailer').innerHTML = '';
  
  if(data.Search){
    data.Search.forEach(movie => {
      resultsDiv.innerHTML += `
        <div class="card" onclick="playTrailer('${movie.Title}')">
          <img src="${movie.Poster !== 'N/A' ? movie.Poster : 'https://via.placeholder.com/200x300?text=No+Image'}" alt="${movie.Title}">
          <h3>${movie.Title}</h3>
          <p>${movie.Year}</p>
        </div>
      `;
    });
  } else {
    resultsDiv.innerHTML = "<p>No movies found</p>";
  }
}

function playTrailer(title) {
  // Search YouTube for "Movie Title Official Trailer"
  const trailerDiv = document.getElementById('trailer');
  trailerDiv.innerHTML = `
    <h2>Trailer: ${title}</h2>
    <iframe src="https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(title + ' Official Trailer')}" 
    allow="autoplay; encrypted-media" allowfullscreen></iframe>
  `;
  trailerDiv.scrollIntoView({behavior: 'smooth'});
}
</script>
</body>
</html>
