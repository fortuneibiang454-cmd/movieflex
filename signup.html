<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - MovieFlix</title>
  <style>
    body { background:#141414; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; } 
    .box { background:#222; padding:30px; border-radius:10px; width:320px; text-align:center; } 
    input, button { width:100%; padding:12px; margin:10px 0; border:none; border-radius:5px; box-sizing:border-box; } 
    button { background:#E50914; color:white; font-weight:bold; cursor:pointer; } 
    button:hover { background:#b20710; }
    a { color:#E50914; text-decoration:none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Create Account</h2>
    <form id="signupForm"> <!-- ADDED FORM TAG -->
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Sign Up</button> <!-- CHANGED TO type="submit" -->
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>

  <!-- ONLY 1 FIREBASE SCRIPT BLOCK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBPMIyM0HHN27aW8PvkIN0RNzFk1g-l2Co",
      authDomain: "movieflex-482dd.firebaseapp.com",
      databaseURL: "https://movieflex-482dd-default-rtdb.firebaseio.com",
      projectId: "movieflex-482dd",
      storageBucket: "movieflex-482dd.firebasestorage.app",
      messagingSenderId: "646299297093",
      appId: "1:646299297093:web:6fb9822774507d3f20ca2c"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    document.getElementById('signupForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      createUserWithEmailAndPassword(auth, email, password)
       .then((userCredential) => {
          // Save user to database
          set(ref(db, 'users/' + userCredential.user.uid), {
            email: email,
            createdAt: new Date().toISOString()
          });
          alert("Account Created!");
          window.location.href = "index.html"; // Go straight to movies
       })
       .catch((error) => { alert("Signup Failed: " + error.message); });
    });
  </script>
</body>
</html>
