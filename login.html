<!DOCTYPE html>
<html>
<head>
  <title>Login - MovieFlix</title>
  <style>
    body { background:#141414; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
    .box { background:#222; padding:30px; border-radius:10px; width:320px; text-align:center; }
    input, button { width:100%; padding:12px; margin:10px 0; border:none; border-radius:5px; box-sizing:border-box; }
    button { background:#E50914; color:white; font-weight:bold; cursor:pointer; }
    a { color:#E50914; text-decoration:none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Login to MovieFlix</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p><a href="signup.html">Sign Up</a> | <a href="reset.html">Forgot Password?</a></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyBPMIyM0HHN27aW8PvkIN0RNzFk1g-l2Co",
      authDomain: "movieflex-482dd.firebaseapp.com",
      databaseURL: "https://movieflex-482dd-default-rtdb.firebaseio.com",
      projectId: "movieflex-482dd",
      storageBucket: "movieflex-482dd.firebasestorage.app",
      messagingSenderId: "646299297093",
      appId: "1:646299297093:web:6fb9822774507d3f20ca2c"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, email, password)
        .then(() => { alert("Login Success!"); window.location.href = "index.html"; })
        .catch(err => alert(err.message));
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
<script>
  // 1. Paste your Firebase config here
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "your-project.firebaseapp.com",
    projectId: "your-project",
  };
  firebase.initializeApp(firebaseConfig);

  // 2. Real Login
  document.querySelector('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.querySelector('input[type=email]').value;
    const password = document.querySelector('input[type=password]').value;
    
    firebase.auth().signInWithEmailAndPassword(email, password)
     .then(() => { window.location.href = "index.html"; })
     .catch((error) => { alert(error.message); });
  });
</script>
